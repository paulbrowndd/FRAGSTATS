<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Edania II Chest Map</title>
<style>
  :root {
    --bg: #183435; --panel: #161b22e6; --line: #2b3440;
    --fg: #e6edf3; --dim: #8b949e; --accent: #ffd54a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--fg);
    font: 13px/1.5 "Pretendard", "Malgun Gothic", system-ui, sans-serif; }
  #map { position: absolute; inset: 0; cursor: grab; touch-action: none; }
  #map.drag { cursor: grabbing; }

  .panel { position: absolute; background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; backdrop-filter: blur(8px); }

  /* 화면(또는 iframe)이 낮아도 아래 버튼(전체 보기·저장 등)이 잘리지 않게 — 패널 안에서 스크롤. */
  #ui { top: 12px; left: 12px; width: 252px; padding: 12px 14px;
    max-height: calc(100vh - 24px); display: flex; flex-direction: column; z-index: 8; }
  #ui-body { min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding-right: 2px; }
  #ui-body::-webkit-scrollbar { width: 6px; }
  #ui-body::-webkit-scrollbar-thumb { background: #3a4552; border-radius: 3px; }
  #ui h1 { margin: 0 0 8px; font-size: 15px; letter-spacing: -.2px; }
  #ui-head { cursor: pointer; user-select: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  #ui-caret { flex: none; color: var(--accent); font-size: 12px; font-weight: 600; opacity: .85; }
  #ui-head:hover #ui-caret { opacity: 1; text-decoration: underline; }
  #ui.collapsed #ui-body { display: none; }

  #q { width: 100%; background: #0d1117; color: var(--fg); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 9px; font-size: 12.5px; font-family: inherit; }
  #q:focus { outline: none; border-color: #4d5b6b; }
  /* 검색 결과 — 아래 레이어 토글과 헷갈리지 않게, 입력창 밑에 뜨는 드롭다운으로 분리한다. */
  #search-wrap { position: relative; }
  #hits { position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 9;
    max-height: 244px; overflow-y: auto; padding: 4px;
    background: #0d1117f7; border: 1px solid #4d5b6b; border-radius: 8px;
    box-shadow: 0 10px 28px #000a; backdrop-filter: blur(8px); }
  #hits:empty, #hits.hidden { display: none; }
  #hits .hits-h { position: sticky; top: -4px; z-index: 1; background: #0d1117;
    display: flex; align-items: center; gap: 6px; cursor: default;
    padding: 5px 6px; margin: -4px -4px 3px; border-bottom: 1px solid var(--line);
    border-radius: 8px 8px 0 0; color: var(--dim); font-size: 11px; }
  #hits .hits-h b { color: var(--fg); font-variant-numeric: tabular-nums; }
  #hits .hits-x { margin-left: auto; padding: 0 3px; cursor: pointer; font-size: 12px; }
  #hits .hits-x:hover { color: var(--fg); }
  #hits .it, #hits .none { padding: 4px 8px; border-radius: 5px; font-size: 12px;
    display: flex; gap: 8px; align-items: center; }
  #hits .it { cursor: pointer; }
  #hits .it:hover { background: #ffffff14; }
  #hits .a { color: var(--dim); font-size: 11px; margin-left: auto; }
  #hits .none { color: var(--dim); cursor: default; }
  #hits .off { opacity: .45; }

  .sec-h { color: var(--dim); font-size: 11px; font-weight: 700; letter-spacing: .2px;
    margin: 2px 0 4px; }

  .layer { display: flex; align-items: center; gap: 8px; padding: 5px 6px;
    border-radius: 6px; cursor: pointer; user-select: none; }
  .layer:hover { background: #ffffff0e; }
  .layer input { accent-color: var(--accent); margin: 0; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none;
    box-shadow: 0 0 0 1.5px #0009; }
  .layer .nm { flex: 1; }
  .layer .ct { color: var(--dim); font-variant-numeric: tabular-nums; font-size: 11px; }

  #prog { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line);
    font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }
  #prog b { color: var(--fg); }
  #prog .prog-h { color: var(--fg); font-weight: 700; margin-bottom: 4px; }
  #prog .prog-row { line-height: 1.7; }
  #prog .prog-pct { color: var(--dim); }
  #prog .prog-k { color: var(--fg); }
  #prog .prog-coin { display: flex; align-items: center; gap: 6px; color: var(--fg);
    white-space: nowrap;
    padding-bottom: 7px; margin-bottom: 7px; border-bottom: 1px solid var(--line); }
  #prog .prog-coin-ic { width: 18px; height: 18px; flex: none; image-rendering: -webkit-optimize-contrast; }

  .row { display: flex; gap: 6px; margin-top: 8px; }
  button { flex: 1; background: #21262d; color: var(--fg); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 8px; cursor: pointer; font-size: 12px;
    font-family: inherit; }
  button:hover { background: #30363d; }
  button.on { background: #2d5a3d; border-color: #3d7a52; }

  #tip { position: absolute; pointer-events: none; padding: 6px 9px; font-size: 12px;
    background: #0d1117f2; border: 1px solid var(--line); border-radius: 7px;
    display: none; white-space: nowrap; z-index: 5; }
  #tip .k, .k { color: var(--dim); font-size: 11px; }

  #sel { display: none; padding: 9px 11px; width: 210px; z-index: 6; }
  #sel .t { font-weight: 600; margin-bottom: 2px; }
  #sel .sel-coin { display: flex; align-items: center; gap: 5px; color: var(--fg); font-size: 12px; }
  #sel .sel-coin .prog-coin-ic { width: 14px; height: 14px; }
  #sel .sel-area { margin-top: 3px; }
  #sel .sel-need { margin-top: 5px; padding-top: 5px; border-top: 1px solid var(--line);
    color: #ffb35c; font-size: 11.5px; font-weight: 600; }

  #toast { left: 50%; bottom: 26px; transform: translateX(-50%); padding: 8px 14px;
    font-size: 12.5px; opacity: 0; transition: opacity .25s; pointer-events: none; }

  /* 언어 전환 — 우상단은 부모(SPA) 전체화면 버튼과 겹치므로 우하단에 둔다. */
  #lang { bottom: 12px; right: 12px; display: flex; gap: 3px; padding: 3px; z-index: 7; }
  #lang button { flex: none; padding: 5px 11px; font-size: 12px; border: 0;
    background: transparent; color: var(--dim); border-radius: 7px; }
  #lang button:hover { background: #ffffff14; color: var(--fg); }
  #lang button.on { background: #30363d; color: var(--fg); font-weight: 700; }

  /* 선택 마커의 이미지 섬네일 */
  #sel-imgs { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 2px; }
  #sel-imgs:empty { display: none; }
  #sel-imgs img { width: 64px; height: 64px; object-fit: cover; border-radius: 6px;
    border: 1px solid var(--line); cursor: zoom-in; background: #0d1117; }
  #sel-imgs img:hover { border-color: var(--accent); }

  /* 금주화 퀘스트 체크리스트 */
  #sel-quests { margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--line); }
  #sel-quests:empty { display: none; padding: 0; border: 0; margin: 0; }
  #sel-quests .q-row { display: flex; align-items: center; gap: 7px; padding: 3px 2px;
    border-radius: 5px; cursor: pointer; user-select: none; font-size: 12px; }
  #sel-quests .q-row:hover { background: #ffffff10; }
  #sel-quests .q-row input { accent-color: var(--accent); margin: 0; flex: none; }
  #sel-quests .q-row .q-n { flex: 1; }
  #sel-quests .q-row.on .q-n { color: var(--dim); text-decoration: line-through; }
  #sel-quests .q-row .q-c { color: var(--accent); font-variant-numeric: tabular-nums; font-size: 11px; }
  #sel-quests .q-sum { display: flex; justify-content: space-between; color: var(--dim);
    font-size: 11px; margin-bottom: 3px; }
  #sel-quests .q-sum b { color: var(--fg); font-variant-numeric: tabular-nums; }

  /* 공략 영상 썸네일 — 이미지 썸네일과 같은 크기, 가운데 재생 아이콘 */
  #sel-imgs .vid-thumb { position: relative; width: 64px; height: 64px; flex: none;
    border-radius: 6px; overflow: hidden; border: 1px solid var(--line);
    background: #0d1117; cursor: pointer; }
  #sel-imgs .vid-thumb img { width: 100%; height: 100%; object-fit: cover; border: 0; border-radius: 0; }
  #sel-imgs .vid-thumb::after { content: '▶'; position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 19px; background: #00000047; text-shadow: 0 1px 4px #000; }
  #sel-imgs .vid-thumb:hover { border-color: var(--accent); }

  /* 이미지 크게 보기(라이트박스) */
  #lb { position: fixed; inset: 0; background: #000000e8; display: none;
    align-items: center; justify-content: center; z-index: 50; touch-action: pan-y; }
  #lb.open { display: flex; }
  #lb img { max-width: 92vw; max-height: 88vh; object-fit: contain; border-radius: 8px;
    box-shadow: 0 10px 50px #000a; user-select: none; -webkit-user-drag: none; }
  #lb .nav { position: absolute; top: 50%; transform: translateY(-50%);
    width: 52px; height: 52px; border-radius: 50%; background: #ffffff1a;
    border: 1px solid #ffffff33; color: #fff; font-size: 26px; line-height: 1;
    cursor: pointer; display: flex; align-items: center; justify-content: center; }
  #lb .nav:hover { background: #ffffff33; }
  #lb #lb-prev { left: 18px; } #lb #lb-next { right: 18px; }
  #lb #lb-close { top: 16px; right: 18px; transform: none; width: 42px; height: 42px; font-size: 20px; }
  #lb #lb-count { position: absolute; bottom: 42px; left: 50%; transform: translateX(-50%);
    color: #fff; font-size: 13px; background: #0009; padding: 4px 12px; border-radius: 20px;
    font-variant-numeric: tabular-nums; }
  #lb #lb-title { position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
    max-width: 80vw; text-align: center; color: #fff; font-size: 15px; font-weight: 700;
    text-shadow: 0 1px 4px #000c; letter-spacing: -.2px; }
  #lb #lb-credit { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
    color: #b9c2cc; font-size: 11.5px; text-shadow: 0 1px 3px #000c; }
  /* 라이트박스 영상 모드 — 이미지 대신 유튜브 플레이어를 띄운다 */
  #lb-vid { display: none; width: min(92vw, 1280px); aspect-ratio: 16 / 9; max-height: 84vh;
    border: 0; border-radius: 8px; box-shadow: 0 10px 50px #000a; background: #000; }
  #lb.video #lb-img { display: none; }
  #lb.video #lb-vid { display: block; }
  #lb-credit a { color: inherit; }

  /* 이미지/맵 우클릭 저장 방지 */
  #lb img, #sel-imgs img, #map { -webkit-touch-callout: none; }

  @media (max-width: 520px) {
    #ui { width: min(210px, calc(100vw - 24px)); top: 8px; left: 8px; padding: 10px 12px; }
    #sel { width: min(210px, calc(100vw - 24px)); }
    #lang { bottom: 8px; right: 8px; }
    #map-credit { left: 8px; bottom: 8px; max-width: calc(100vw - 96px); }
  }
</style>

<canvas id="map"></canvas>

<div id="ui" class="panel">
  <h1 id="ui-head">에다니아 내부 <span id="ui-caret">접기</span></h1>
  <div id="search-wrap">
    <input id="q" placeholder="검색 — 유산 46 · 흔적 XLVI 등" autocomplete="off">
    <div id="hits"></div>
  </div>
  <div id="ui-body">
    <div id="layers-h" class="sec-h">지도 표시</div>
    <div id="layers"></div>
    <div id="prog"></div>
    <div class="row">
      <button id="btn-fit">전체 보기</button>
      <button id="btn-reset">완료 초기화</button>
    </div>
    <div class="row">
      <button id="btn-export">저장</button>
      <button id="btn-import">불러오기</button>
    </div>
    <input id="file-import" type="file" hidden>
  </div>
</div>

<div id="sel" class="panel">
  <div class="t" id="sel-t"></div>
  <div class="k" id="sel-s"></div>
  <div id="sel-quests"></div>
  <div id="sel-imgs"></div>
  <div class="row">
    <button id="sel-done"></button>
  </div>
</div>


<div id="map-credit" style="position:absolute;bottom:12px;left:12px;z-index:7;font-size:11px;color:#8b949e;background:#161b22cc;border:1px solid #2b3440;border-radius:8px;padding:6px 10px;backdrop-filter:blur(8px);">
  Map data from <a href="https://www.korbdo.co.kr/#tachyon" target="_blank" rel="noopener" style="color:#5fd0e0;text-decoration:none;">korbdo.co.kr</a>
</div>
<div id="lang" class="panel">
  <button id="lang-ko">한국어</button><button id="lang-en">English</button>
</div>

<div id="tip"></div>
<div id="toast" class="panel"></div>

<div id="lb">
  <div id="lb-title"></div>
  <button class="nav" id="lb-close">✕</button>
  <button class="nav" id="lb-prev">‹</button>
  <img id="lb-img" alt="">
  <iframe id="lb-vid" allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
          allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
  <button class="nav" id="lb-next">›</button>
  <div id="lb-count"></div>
  <div id="lb-credit">이미지 출처 : 검은사막 인벤 - 카나트 님</div>
</div>

<script src="https://www.korbdo.co.kr/Edania2/data/tiles.js?v=1786596824"></script>
<script src="https://www.korbdo.co.kr/Edania2/data/markers.js?v=1787791907"></script>
<script src="https://www.korbdo.co.kr/Edania2/data/images.js?v=1787724096"></script>
<script src="https://www.korbdo.co.kr/Edania2/data/videos.js?v=1787724561"></script>
<script>
// index.html 과 같은 데이터/타일을 쓰되 에다니아 영역 밖으로 못 나가게 잠근 버전.
// + 검색 / 습득 완료 체크(localStorage).
const M = window.MARKERS;
if (!M || !M.meta || !M.points) {
  document.body.innerHTML =
    '<div style="display:flex;align-items:center;justify-content:center;height:100vh;padding:24px;text-align:center;color:#e6edf3;font:14px/1.5 system-ui,sans-serif">' +
    '<div><p style="margin:0 0 12px">Map data failed to load.</p>' +
    '<p style="margin:0;color:#8b949e">Try refreshing, or use the ' +
    '<a href="https://www.korbdo.co.kr/#tachyon" target="_blank" rel="noopener" style="color:#5fd0e0">korbdo map</a> directly.</p></div></div>';
  throw new Error('MARKERS failed to load');
}
const TILES = window.TILES || {};
// 마을 NPC 레이어는 당분간 숨김(데이터는 markers.js 에 그대로 있음 — 이 줄만 지우면 복구).
if (M.points) delete M.points.npc;
// 신규 추가됐지만 아직 업데이트(이미지) 안 된 흔적은 숨긴다.
//  → 이미지(images.js)가 있는 흔적만 표시. 이미지 채워지면 자동으로 다시 보임.
if (M.points && M.points.trace && window.IMAGES)
  // 이미지 있는 흔적만 보이게 거르되, 신규(new)는 이미지가 없어도 남긴다
  M.points.trace = M.points.trace.filter(m => window.IMAGES['흔적-' + m.num] || m.new);
const W = M.meta.world;
const SECTOR = W.sector, TILE = W.tile;
const WORLD_X0 = W.sx0 * SECTOR, WORLD_Z1 = (W.sz1 + 1) * SECTOR;
const LEVELS = W.levels.slice().sort((a, b) => a - b);

const toU = wx => (wx - WORLD_X0) / SECTOR;
const toV = wz => (WORLD_Z1 - wz) / SECTOR;
const toWX = u => WORLD_X0 + u * SECTOR;
const toWZ = v => WORLD_Z1 - v * SECTOR;

const OCEAN = '#183435';                       // rader 타일의 바다색
const cv = document.getElementById('map'), ctx = cv.getContext('2d');
const tipEl = document.getElementById('tip'), selEl = document.getElementById('sel');
let DPR = 1, VW = 0, VH = 0;

const CHEST = ['relic', 'trace'];
const ALLCHEST = CHEST.flatMap(id => M.points[id] || []);
// 마커 반지름 — 상자를 다른 마커보다 살짝만 크게
const radius = id => CHEST.includes(id) ? Math.max(2.8, Math.min(6.5, view.k * .22))
                  : id === 'quest' ? Math.max(3.2, Math.min(7.0, view.k * .24))   // 금주화 퀘스트는 눈에 띄게 크게
                                   : Math.max(2.2, Math.min(5.0, view.k * .17));

const on = {};
for (const id in M.points) on[id] = CHEST.includes(id);
// 금주화 퀘스트 NPC 는 거점 관리인이기도 하다.
//  퀘스트 레이어를 꺼도 거점 관리인 레이어가 켜져 있으면 일반 거점으로 계속 보여준다.
const questAsNode = () => (!on.quest && on.node) ? (M.points.quest || []) : [];
const nodeList = () => (M.points.node || []).concat(questAsNode());

// ── 언어 (한국어 / English)
// 영문 이름은 글로벌랩 클라의 ads/languagedata_en.loc 에서 뽑아 마커에 ne/ae 로 넣어뒀다.
// 저장 키(keyOf)는 한국어 그대로 쓴다 — 언어를 바꿔도 완료 기록이 유지돼야 한다.
const I18N = (M.meta && M.meta.i18n) || { ko: {}, en: {} };
const LAYERS_EN = (M.meta && M.meta.layers_en) || {};
let LANG = localStorage.getItem('bdo_lang') === 'ko' ? 'ko' : 'en';
const I18N_EX = {
  ko: { needPre: '선행 ·', needTag: '(선행 {n})', video: '공략 영상', questProgress: '퀘스트 진행', questShort: '퀘스트',
        creditImage: '이미지 출처 : 검은사막 인벤 - 카나트 님', creditVideo: '영상 출처' },
  en: { needPre: 'Requires', needTag: '(Req. {n})', video: 'Guide video', questProgress: 'Quests', questShort: 'Quests',
        creditImage: 'Images : BDO Inven - Kanat', creditVideo: 'Video' } };
const T = k => (I18N[LANG] && I18N[LANG][k]) || (I18N_EX[LANG] && I18N_EX[LANG][k])
            || (I18N.ko && I18N.ko[k]) || (I18N_EX.ko && I18N_EX.ko[k]) || k;
// 데이터(i18n)에 없는 키만 여기서 보충한다.
for (const [k, ko, en] of [['results', '검색 결과', 'Results'],
                           ['clearSearch', '지우기', 'Clear'],
                           ['layersTitle', '지도 표시', 'Map layers']]) {
  if (I18N.ko && !I18N.ko[k]) I18N.ko[k] = ko;
  if (I18N.en && !I18N.en[k]) I18N.en[k] = en;
}
// 지도 라벨용 선행 표시: '흔적 XXVI' → '(선행 XXVI)'
const NEEDTAG = p => {
  const rom = ((LANG === 'en' ? p.needE : p.needL) || '').match(/[IVXLC]+$/);
  return rom ? T('needTag').replace('{n}', rom[0]) : '';
};
const NM = p => (LANG === 'en' && p.ne) ? p.ne : p.n;
const AR = p => (LANG === 'en' && p.ae) ? p.ae : (p.a || '');
const LBL = id => (LANG === 'en' && LAYERS_EN[id]) ? LAYERS_EN[id]
                                                   : M.meta.layers[id].label;
const KND = k => T(k);

// ── 이번 패치로 새로 들어온 지식(new:1)은 색만 다르게 (토글은 기존과 같다)
const NEWDOT = { relic: '#7cff9b', trace: '#ff57e0' };
const NEWTXT = { relic: '#c9ffd6', trace: '#ffc4f2' };
// 금주화 퀘스트는 거점 관리인 NPC 라서, 퀘스트를 다 끝내면 거점 관리인과 같은 연두색이 된다.
const dotCol = (p, id) => (p.new && NEWDOT[id]) ? NEWDOT[id]
  : (id === 'quest' && questAll(p)) ? M.meta.layers.node.color
  : M.meta.layers[id].color;

// 지식(klore)도 완료 대상 — 지식 id(k)는 여러 NPC가 공유하므로, NPC '위치'별로 개별 완료 처리.
//  num 은 좌표 기반 고유 키(데이터 순서 바뀌어도 저장값 안정).
if (M.points.klore) M.points.klore.forEach(p => { if (!p.kind) { p.kind = '지식'; p.num = Math.round(p.x) + '_' + Math.round(p.z); } });
// 금주화 퀘스트(거점 관리인) — 좌표 기반 고유 키. 하위 퀘스트를 하나씩 체크한다.
if (M.points.quest) M.points.quest.forEach(p => { if (!p.kind) { p.kind = '퀘스트'; p.num = Math.round(p.x) + '_' + Math.round(p.z); } });
// 완료 집계 대상: 유산·흔적·지식
const DONEABLE = ['relic', 'trace', 'klore'].flatMap(id => M.points[id] || []);

// ── 습득 완료 (지식 단위로 저장 — 상자가 2곳인 흔적은 같이 처리된다)
const STORE = 'bdo_tachyon_done';
const keyOf = p => `${p.kind}-${p.num}`;
// 완료 상태는 localStorage 에 저장(사람마다/브라우저마다). 쿠키는 ~4KB 한계라 완료가 많아지면
//  통째로 저장이 안 돼 풀리는 문제가 있어 localStorage(수 MB)로 전환. 기존 쿠키는 최초 1회 이전.
function _getCookie(n){ const m = document.cookie.match('(?:^|; )' + n.replace(/([.$?*|{}()\[\]\\\/\+^])/g,'\\$1') + '=([^;]*)'); return m ? decodeURIComponent(m[1]) : ''; }
let DONE = new Set();
try {
  const ls = localStorage.getItem(STORE);
  if (ls != null) {
    DONE = new Set(JSON.parse(ls));
  } else {                                   // 구 쿠키 → localStorage 이전
    const ck = _getCookie(STORE);
    if (ck) {
      DONE = new Set(JSON.parse(ck));
      localStorage.setItem(STORE, JSON.stringify([...DONE]));
      document.cookie = STORE + '=; path=/; max-age=0; SameSite=Lax';   // 큰 쿠키 제거
    }
  }
} catch (e) {}
const FRAG_STORE = 'frag-edania-ii-chests-v1';
const TRACE_KIND = '흔적';
const saveDone = () => { try { localStorage.setItem(STORE, JSON.stringify([...DONE])); } catch (e) {} };

function syncFragTrace(num, done) {
  if (num < 1 || num > 89) return;
  try {
    const saved = JSON.parse(localStorage.getItem(FRAG_STORE) || '{}');
    saved[num] = Object.assign({}, saved[num], { id: num, done: !!done });
    localStorage.setItem(FRAG_STORE, JSON.stringify(saved));
    parent.postMessage({ type: 'frag-trace-done', num, done: !!done }, '*');
  } catch (e) {}
}

function mergeFragIntoDone() {
  try {
    const saved = JSON.parse(localStorage.getItem(FRAG_STORE) || '{}');
    let changed = false;
    for (let id = 1; id <= 89; id++) {
      const key = `${TRACE_KIND}-${id}`;
      if (saved[id]?.done && !DONE.has(key)) {
        DONE.add(key);
        changed = true;
      }
    }
    if (changed) saveDone();
  } catch (e) {}
}

function syncTraceDone(p) {
  if (!p || p.kind !== TRACE_KIND || !p.num) return;
  syncFragTrace(p.num, DONE.has(keyOf(p)));
}

function clearFragTraces() {
  try {
    const saved = JSON.parse(localStorage.getItem(FRAG_STORE) || '{}');
    for (let id = 1; id <= 89; id++) {
      if (saved[id]) saved[id] = Object.assign({}, saved[id], { id, done: false });
    }
    localStorage.setItem(FRAG_STORE, JSON.stringify(saved));
    parent.postMessage({ type: 'frag-trace-reset' }, '*');
  } catch (e) {}
}

mergeFragIntoDone();

window.addEventListener('message', (e) => {
  const msg = e.data;
  if (!msg || typeof msg !== 'object') return;
  if (msg.type === 'frag-trace-set') {
    const num = Number(msg.num);
    if (!Number.isFinite(num) || num < 1 || num > 89) return;
    const key = `${TRACE_KIND}-${num}`;
    if (msg.done) DONE.add(key);
    else DONE.delete(key);
    saveDone();
    progress();
    if (sel?.p?.kind === TRACE_KIND && sel.p.num === num) select(sel.p, sel.id);
    search();
    draw();
    return;
  }
  if (msg.type === 'frag-trace-reset') {
    for (const key of [...DONE]) {
      if (String(key).startsWith(`${TRACE_KIND}-`)) DONE.delete(key);
    }
    saveDone();
    progress();
    search();
    draw();
    return;
  }
  if (msg.type === 'frag-map-resize') {
    resize();
  }
});

const isDone = p => p.kind && (p.quests ? questAll(p) : DONE.has(keyOf(p)));
// ── 금주화 퀘스트: 하위 퀘스트별 개별 완료 (키: '퀘스트-<좌표>#<번호>')
const qKey = (p, i) => `${keyOf(p)}#${i}`;
const qDone = (p, i) => DONE.has(qKey(p, i));
const qCount = p => (p.quests || []).filter((_, i) => qDone(p, i)).length;
const questAll = p => !!(p.quests && p.quests.length) && qCount(p) === p.quests.length;

// ── 마커별 업로드 이미지(지식/유산/흔적). keyOf 우선, 없으면 이름 키(예: 기가고드 전용 폴더).
const IMG = window.IMAGES || {};
const imagesFor = p => IMG[keyOf(p)] || IMG['name-' + (p.n || '')] || [];
const VID = window.VIDEOS || {};                 // 마커별 공략 영상(유튜브 ID)
const videoFor = p => VID[keyOf(p)] || '';
// 이미지 파일 캐시버스터 — 이미지 교체 시 이 숫자만 올리면 새로 받는다.
const IMGV = '1787730442';
const KORBDO_BASE = 'https://www.korbdo.co.kr/Edania2/';
const imgURL = src => encodeURI(src.startsWith('http') ? src : KORBDO_BASE + src) + '?v=' + IMGV;

// ── 볼 수 있는 범위 = 마커 전체를 감싸는 상자 + 여유
const PAD = 2.5;
const BOX = (() => {
  let x0 = 1e9, x1 = -1e9, z0 = 1e9, z1 = -1e9;
  for (const id in M.points) for (const p of M.points[id]) {
    x0 = Math.min(x0, p.x); x1 = Math.max(x1, p.x);
    z0 = Math.min(z0, p.z); z1 = Math.max(z1, p.z);
  }
  return { u0: toU(x0) - PAD, u1: toU(x1) + PAD, v0: toV(z1) - PAD, v1: toV(z0) + PAD };
})();
const BOXW = BOX.u1 - BOX.u0, BOXH = BOX.v1 - BOX.v0;

const view = { u: (BOX.u0 + BOX.u1) / 2, v: (BOX.v0 + BOX.v1) / 2, k: 8 };
let sel = null;                                 // 선택된 마커

// ── 타일 캐시
const cache = new Map();
const have = {};
for (const l in TILES) have[l] = new Set(TILES[l]);

function tileImg(lvl, tx, ty) {
  const key = lvl + '/' + tx + '_' + ty;
  let im = cache.get(key);
  if (im !== undefined) return im;
  if (have[lvl] && !have[lvl].has(tx + '_' + ty)) { cache.set(key, null); return null; }
  im = new Image();
  im.onload = () => draw();
  im.onerror = () => cache.set(key, null);
  im.src = `${KORBDO_BASE}img/tiles/L${lvl}/${tx}_${ty}.webp`;
  cache.set(key, im);
  return im;
}

function pickLevel() {
  for (const l of LEVELS) if (l >= view.k) return l;      // 축소만, 확대는 안 함
  return LEVELS[LEVELS.length - 1];
}

const sx = u => (u - view.u) * view.k + VW / 2;
const sy = v => (v - view.v) * view.k + VH / 2;
const ux = px => (px - VW / 2) / view.k + view.u;
const vy = py => (py - VH / 2) / view.k + view.v;
const kFit = () => Math.min(VW / BOXW, VH / BOXH);

function clamp() {
  view.k = Math.max(kFit(), Math.min(256, view.k));
  const hu = VW / (2 * view.k), hv = VH / (2 * view.k);
  view.u = hu * 2 >= BOXW ? (BOX.u0 + BOX.u1) / 2
                          : Math.max(BOX.u0 + hu, Math.min(BOX.u1 - hu, view.u));
  view.v = hv * 2 >= BOXH ? (BOX.v0 + BOX.v1) / 2
                          : Math.max(BOX.v0 + hv, Math.min(BOX.v1 - hv, view.v));
}

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  VW = innerWidth; VH = innerHeight;
  cv.width = VW * DPR; cv.height = VH * DPR;
  cv.style.width = VW + 'px'; cv.style.height = VH + 'px';
  clamp(); draw();
}

function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, VW, VH);
  ctx.fillStyle = OCEAN;          // 타일 없는 곳은 전부 바다다
  ctx.fillRect(0, 0, VW, VH);

  // ── 타일
  const lvl = pickLevel();
  const span = TILE / lvl, px = span * view.k;
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  for (let ty = Math.floor(vy(0) / span); ty < Math.ceil(vy(VH) / span); ty++) {
    for (let tx = Math.floor(ux(0) / span); tx < Math.ceil(ux(VW) / span); tx++) {
      if (tx < 0 || ty < 0) continue;
      const im = tileImg(lvl, tx, ty);
      if (!im || !im.complete || !im.naturalWidth) continue;
      ctx.drawImage(im, sx(tx * span), sy(ty * span), px + 1, px + 1);
    }
  }

  // ── 마커
  for (const id of ['npc', 'node', 'quest', 'klore', 'trace', 'relic']) {
    if (!on[id] || !M.points[id]) continue;
    const r = radius(id);
    const col = M.meta.layers[id].color;   // 신규는 아래에서 개별로 덮는다
    ctx.lineWidth = Math.max(1, r * .35);
    for (const p of (id === 'node' ? nodeList() : M.points[id])) {
      const X = sx(toU(p.x)), Y = sy(toV(p.z));
      if (X < -20 || Y < -20 || X > VW + 20 || Y > VH + 20) continue;
      // 완료 표시로 흐리게 처리하지만, 금주화 퀘스트는 색이 바뀌므로 선명하게 둔다
      ctx.globalAlpha = (isDone(p) && id !== 'quest') ? .45 : 1;
      ctx.fillStyle = dotCol(p, id); ctx.strokeStyle = '#0b0f14cc';
      ctx.beginPath(); ctx.arc(X, Y, r, 0, 7); ctx.fill(); ctx.stroke();
      ctx.globalAlpha = 1;
      if (sel && sel.p === p) {                  // 선택 표시
        ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(X, Y, r * 2.1, 0, 7); ctx.stroke();
        ctx.lineWidth = Math.max(1, r * .35);
      }
    }
  }

  // ── 라벨: '유산 X' / '흔적 X' / '지식'
  const NEED_TAG_ZOOM = 40;          // 선행 꼬리표를 붙이기 시작하는 배율
  const labels = [];
  const dy = radius('relic') + 10;
  for (const id of ['relic', 'trace']) {
    if (!on[id] || !M.points[id]) continue;
    const col = id === 'relic' ? '#ffe9a3' : '#ffb3b3';
    for (const p of M.points[id]) {
      // 선행 조건이 있는 지점은 축소 상태에서 라벨을 아예 그리지 않는다(점만 표시).
      //  두 줄 라벨이라 축소하면 주변 글자와 뒤엉켜 지저분해지기 때문.
      if (p.needL && view.k < NEED_TAG_ZOOM) continue;
      // 번호가 없는 지점(버그 상자 등)은 이름을 그대로 쓴다
      labels.push({ p, t: p.rom ? `${KND(p.kind)} ${p.rom}` : NM(p),
                    t2: p.needL ? NEEDTAG(p) : '',      // 선행 표시는 한 줄 아래에
                    col: (p.new && NEWTXT[id]) ? NEWTXT[id] : col, dy });
    }
  }
  if (on.klore && M.points.klore && view.k >= 26)
    for (const p of M.points.klore)
      labels.push({ p, t: T('know'), col: '#bfe6ff', dy: radius('klore') + 9 });

  const FS = (document.fullscreenElement || document.webkitFullscreenElement) ? 1.45 : 1;
  if (view.k >= 16) {
    ctx.font = '700 ' + Math.round(12 * FS) + 'px system-ui, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 3.5; ctx.strokeStyle = '#0b0f14e6';
    const put = [];
    for (const L of labels) {
      const X = sx(toU(L.p.x)), Y = sy(toV(L.p.z)) + L.dy;
      if (X < 0 || Y < 0 || X > VW || Y > VH) continue;
      // 겹침 판정은 '이름 줄'만 기준으로 한다.
      //  꼬리표 폭까지 넣으면 폭이 넓은 영어 라벨이 서로 밀어내 축소 시 이름이 아예 안 보였다.
      const w = ctx.measureText(L.t).width + 8;
      if (put.some(q => Math.abs(q[0] - X) < (q[2] + w) / 2 && Math.abs(q[1] - Y) < 13)) continue;
      put.push([X, Y, w]);
      ctx.globalAlpha = isDone(L.p) ? .45 : 1;
      ctx.fillStyle = L.col;
      ctx.strokeText(L.t, X, Y); ctx.fillText(L.t, X, Y);
      if (L.t2) {                                   // 둘째 줄(선행 표시) — 크기만 한 단계 작게
        const Y2 = Y + Math.round(12 * FS);
        ctx.font = '700 ' + Math.round(10 * FS) + 'px system-ui, sans-serif';
        ctx.lineWidth = 3;
        ctx.strokeText(L.t2, X, Y2); ctx.fillText(L.t2, X, Y2);
        ctx.font = '700 ' + Math.round(12 * FS) + 'px system-ui, sans-serif';   // 이름 줄 설정 복구
        ctx.lineWidth = 3.5;
      }
      ctx.globalAlpha = 1;
    }
  }

  // ── 금주화 퀘스트 NPC — 이름(알루스틴)을 위에, 거점 이름(앙가부 전초기지)을 아래에.
  //  거점 관리인 목록에서 빠졌으므로 거점 이름 표기는 여기서 이어받는다.
  if (on.quest && M.points.quest) {
    for (const p of M.points.quest) {
      const X = sx(toU(p.x)), Y = sy(toV(p.z));
      if (X < 0 || Y < 0 || X > VW || Y > VH) continue;
      const r = radius('quest');
      ctx.textAlign = 'center'; ctx.strokeStyle = '#0b0f14e6';
      // 거점 이름 — 다른 거점 관리인과 같은 자리(마커 위)에 같은 톤으로
      ctx.textBaseline = 'bottom'; ctx.lineWidth = 3;
      ctx.font = '600 ' + Math.round(11 * FS) + 'px system-ui, sans-serif';
      ctx.fillStyle = '#dbe7c9';
      const area = NM(p).split('—').pop().trim();
      ctx.strokeText(area, X, Y - r - 4); ctx.fillText(area, X, Y - r - 4);
      // NPC 이름 — 아직 할 퀘스트가 남았을 때만 눈에 띄게 붙인다(다 끝내면 일반 거점처럼 조용히)
      if (!questAll(p)) {
        ctx.textBaseline = 'top'; ctx.lineWidth = 3.5;
        ctx.font = '700 ' + Math.round(12.5 * FS) + 'px system-ui, sans-serif';
        ctx.fillStyle = dotCol(p, 'quest');
        const npc = NM(p).split('—')[0].trim();
        ctx.strokeText(npc, X, Y + r + 3); ctx.fillText(npc, X, Y + r + 3);
      }
    }
  }

  // ── 거점 이름
  if (on.node && M.points.node) {
    ctx.font = '600 ' + Math.round(11 * FS) + 'px system-ui, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
    ctx.lineWidth = 3; ctx.strokeStyle = '#0b0f14cc'; ctx.fillStyle = '#dbe7c9';
    for (const p of nodeList()) {
      const X = sx(toU(p.x)), Y = sy(toV(p.z));
      if (X < 0 || Y < 0 || X > VW || Y > VH) continue;
      const t = NM(p).split('—').pop().trim();
      ctx.strokeText(t, X, Y - 7); ctx.fillText(t, X, Y - 7);
    }
  }
  placeSel();
}

// ── 선택 패널
function placeSel() {
  if (!sel) { selEl.style.display = 'none'; return; }
  const X = sx(toU(sel.p.x)), Y = sy(toV(sel.p.z));
  selEl.style.display = 'block';
  selEl.style.left = Math.max(8, Math.min(X + 16, VW - selEl.offsetWidth - 8)) + 'px';
  selEl.style.top = Math.max(8, Math.min(Y + 14, VH - selEl.offsetHeight - 8)) + 'px';
}

function select(p, id) {
  sel = { p, id };
  document.getElementById('sel-t').textContent = NM(p);
  const base = CHEST.includes(id) ? `${AR(p)}${p.card ? ' · ' + T('know') + ' ' + p.card : ''}`
                                  : (p.quests ? `${LBL(id)} · ${AR(p)}` : `${LBL(id)}`);
  const coin = CHEST.includes(id) ? coinOf(p, id) : (p.quests ? (p.coin || 0) : null);
  document.getElementById('sel-s').innerHTML =
    (coin != null ? `<div class="sel-coin"><img class="prog-coin-ic" src="${imgURL('img/00890085.webp')}" alt="${T('coin')}">${T('coinN').replace('{n}', coin)}</div>` : '') +
    `<div class="sel-area">${base}</div>` +
    // 선행 조건 (없으면 아무것도 안 나온다)
    (p.needL ? `<div class="sel-need">${T('needPre')} ${LANG === 'en' ? p.needE : p.needL}</div>` : '');
  // 금주화 퀘스트 — 하위 퀘스트를 하나씩 체크할 수 있는 목록
  const ql = document.getElementById('sel-quests');
  ql.innerHTML = '';
  if (p.quests && p.quests.length) {
    const gotCoin = p.quests.reduce((t, q, i) => t + (qDone(p, i) ? (q.c || 0) : 0), 0);
    const sum = document.createElement('div');
    sum.className = 'q-sum';
    sum.innerHTML = `<span>${T('questProgress')}</span><span><b>${qCount(p)}</b>/${p.quests.length} · <b>${gotCoin}</b>/${p.coin || 0}</span>`;
    ql.appendChild(sum);
    p.quests.forEach((q, i) => {
      const row = document.createElement('label');
      row.className = 'q-row' + (qDone(p, i) ? ' on' : '');
      row.innerHTML = `<input type="checkbox"${qDone(p, i) ? ' checked' : ''}>` +
        `<span class="q-n">${LANG === 'en' ? (q.ne || q.n) : q.n}</span>` +
        `<span class="q-c">+${q.c || 0}</span>`;
      row.querySelector('input').onchange = e => {
        const k = qKey(p, i);
        e.target.checked ? DONE.add(k) : DONE.delete(k);
        saveDone(); progress(); select(p, id);   // 금주화 합계·색·버튼을 한 번에 갱신
      };
      ql.appendChild(row);
    });
  }
  const b = document.getElementById('sel-done');
  b.style.display = p.kind ? '' : 'none';
  b.textContent = isDone(p) ? T('undone') : T('done');
  // 색은 '완료' 쪽에 준다 — 눌러야 할 버튼이 눈에 띄게(완료 취소는 담백하게)
  b.classList.toggle('on', !isDone(p));
  // 섬네일 — 이미지들 뒤에 공략 영상을 마지막 항목으로 붙인다.
  //  라이트박스 목록(items)도 같은 순서라, 좌우로 넘기면 마지막에 영상이 나온다.
  const imgs = imagesFor(p);
  const vid = videoFor(p);
  const items = vid ? [...imgs, { v: vid }] : imgs;
  const gal = document.getElementById('sel-imgs');
  gal.innerHTML = '';
  imgs.forEach((src, i) => {
    const im = document.createElement('img');
    im.src = imgURL(src); im.loading = 'lazy'; im.alt = p.n;
    im.onclick = () => openLb(items, i, p.n);
    gal.appendChild(im);
  });
  if (vid) {
    const box = document.createElement('div');
    box.className = 'vid-thumb';
    box.title = T('video');
    const th = document.createElement('img');
    th.src = `https://i.ytimg.com/vi/${vid}/mqdefault.jpg`;
    th.alt = T('video');
    // 유튜브 섬네일을 못 받아와도 재생 버튼은 그대로 보이게(빈 칸처럼 보이지 않도록)
    th.onerror = () => { th.remove(); box.style.background = '#3a1414'; };
    box.appendChild(th);
    box.onclick = () => openLb(items, items.length - 1, p.n);
    gal.appendChild(box);
  }
  draw();
}

document.getElementById('sel-done').onclick = () => {

// ── 상호작용
let drag = null;
let pinch = null;
let touchTap = null;

function zoomAt(px, py, factor) {
  const u0 = ux(px), v0 = vy(py);
  view.k = Math.max(kFit(), Math.min(256, view.k * factor));
  view.u = u0 - (px - VW / 2) / view.k;
  view.v = v0 - (py - VH / 2) / view.k;
  clamp();
  draw();
}

function touchDist(touches) {
  const dx = touches[0].clientX - touches[1].clientX;
  const dy = touches[0].clientY - touches[1].clientY;
  return Math.hypot(dx, dy);
}

function touchCenter(touches) {
  return {
    x: (touches[0].clientX + touches[1].clientX) / 2,
    y: (touches[0].clientY + touches[1].clientY) / 2,
  };
}

function endDrag() {
  drag = null;
  pinch = null;
  touchTap = null;
  cv.classList.remove('drag');
}

function tapSelect(clientX, clientY) {
  const near = nearest({ clientX, clientY });
  if (near) select(near.p, near.id);
  else { sel = null; draw(); }
}

cv.addEventListener('pointerdown', e => {
  if (e.pointerType === 'touch') return;
  drag = { x: e.clientX, y: e.clientY, u: view.u, v: view.v };
  cv.setPointerCapture(e.pointerId);
  cv.classList.add('drag');
});
cv.addEventListener('pointerup', e => {
  if (e.pointerType === 'touch') return;
  if (drag && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 4) tapSelect(e.clientX, e.clientY);
  endDrag();
});
cv.addEventListener('pointermove', e => {
  if (e.pointerType === 'touch') return;
  if (drag) {
    view.u = drag.u - (e.clientX - drag.x) / view.k;
    view.v = drag.v - (e.clientY - drag.y) / view.k;
    clamp(); draw(); tipEl.style.display = 'none';
    return;
  }
  hover(e);
});
cv.addEventListener('pointercancel', endDrag);

cv.addEventListener('touchstart', e => {
  if (e.touches.length === 2) {
    e.preventDefault();
    endDrag();
    const c = touchCenter(e.touches);
    pinch = {
      d0: touchDist(e.touches),
      k0: view.k,
      anchorU: ux(c.x),
      anchorV: vy(c.y),
    };
    return;
  }
  if (e.touches.length === 1 && !pinch) {
    const t = e.touches[0];
    drag = { x: t.clientX, y: t.clientY, u: view.u, v: view.v };
    touchTap = { x: t.clientX, y: t.clientY };
    cv.classList.add('drag');
  }
}, { passive: false });

cv.addEventListener('touchmove', e => {
  if (e.touches.length === 2 && pinch) {
    e.preventDefault();
    const c = touchCenter(e.touches);
    const scale = touchDist(e.touches) / pinch.d0;
    view.k = Math.max(kFit(), Math.min(256, pinch.k0 * scale));
    view.u = pinch.anchorU - (c.x - VW / 2) / view.k;
    view.v = pinch.anchorV - (c.y - VH / 2) / view.k;
    clamp();
    draw();
    tipEl.style.display = 'none';
    return;
  }
  if (e.touches.length === 1 && drag && !pinch) {
    e.preventDefault();
    const t = e.touches[0];
    view.u = drag.u - (t.clientX - drag.x) / view.k;
    view.v = drag.v - (t.clientY - drag.y) / view.k;
    clamp();
    draw();
    tipEl.style.display = 'none';
  }
}, { passive: false });

cv.addEventListener('touchend', e => {
  if (e.touches.length < 2) pinch = null;
  if (e.touches.length > 0) return;
  if (drag && touchTap) {
    const t = e.changedTouches[0];
    if (t && Math.hypot(t.clientX - touchTap.x, t.clientY - touchTap.y) < 12) {
      tapSelect(touchTap.x, touchTap.y);
    }
  }
  endDrag();
});

cv.addEventListener('wheel', e => {
  e.preventDefault();
  zoomAt(e.clientX, e.clientY, Math.pow(1.0016, -e.deltaY));
}, { passive: false });

// ── 라이트박스(이미지 크게 보기 + 좌우 넘김)

function lbGo(d) { if (lbList.length) { lbIdx = (lbIdx + d + lbList.length) % lbList.length; renderLb(); } }

let toastT;
function toast(msg) {

  el.textContent = msg; el.style.opacity = 1;
  clearTimeout(toastT);
  toastT = setTimeout(() => el.style.opacity = 0, 1600);

function nearest(e, R = 18) {
  let best = null, bd = R * R;
  for (const id in M.points) {
    if (!on[id] && !(id === 'quest' && on.node)) continue;   // 퀘스트 NPC 는 거점 관리인으로도 잡힌다
    for (const p of M.points[id]) {
      const dx = sx(toU(p.x)) - e.clientX, dy = sy(toV(p.z)) - e.clientY;
      const d = dx * dx + dy * dy;
      if (d < bd) { bd = d; best = { p, id }; }
    }
  }
  return best;
}

function hover(e) {
  const best = nearest(e);
  // 지식·유산·흔적은 호버 툴팁 표시 안 함(클릭으로 선택). 그 외(NPC·거점)만 호버.
  if (!best || best.id === 'relic' || best.id === 'trace' || best.id === 'klore') { tipEl.style.display = 'none'; return; }
  const { p, id } = best;
  tipEl.innerHTML = `<div><b>${NM(p)}</b>${isDone(p) ? ' <span class="k">' + T('done') + '</span>' : ''}</div>` +
    (CHEST.includes(id)
      ? `<div class="k">${AR(p)}${p.card ? ' · ' + T('know') + ' ' + p.card : ''}</div>`
      : `<div class="k">${LBL(id)}</div>`);
  tipEl.style.display = 'block';
  tipEl.style.left = Math.min(e.clientX + 14, VW - tipEl.offsetWidth - 8) + 'px';
  tipEl.style.top = (e.clientY + 16) + 'px';
}

// ── 검색
const ROMAN = { I: 1, V: 5, X: 10, L: 50, C: 100 };
function fromRoman(s) {
  let t = 0;
  for (let i = 0; i < s.length; i++) {
    const a = ROMAN[s[i]], b = ROMAN[s[i + 1]];
    if (!a) return null;
    t += (b && a < b) ? -a : a;
  }
  return t || null;
}

function focusPoint(p, id) {
  view.k = Math.max(view.k, 70);
  view.u = toU(p.x); view.v = toV(p.z);
  clamp(); select(p, id);
}

function search() {
  const raw = document.getElementById('q').value.trim();
  const hits = document.getElementById('hits');
  hits.innerHTML = '';
  hits.classList.remove('hidden');
  if (!raw) return;
  const s = raw.toUpperCase().replace(/\s+/g, '');
  let kind = null;
  if (s.includes('유산') || s.includes('LEGACY')) kind = '유산';
  else if (s.includes('흔적') || s.includes('TRACE')) kind = '흔적';
  const rest = s.replace(/유산|흔적|LEGACY|TRACES?|TACHYON/g, '');
  const num = /^\d+$/.test(rest) ? +rest : (/^[IVXLC]+$/.test(rest) ? fromRoman(rest) : null);

  const out = [];
  for (const id of ['relic', 'trace', 'klore', 'node', 'quest', 'npc']) {
    if (!on[id] || !M.points[id]) continue;
    for (const p of M.points[id]) {
      const hay = ((p.n || '') + ' ' + (p.a || '') + ' '
                   + (p.ne || '') + ' ' + (p.ae || '')).toUpperCase();
      let ok;
      if (p.kind) {                              // 타키온 상자
        if (kind && p.kind !== kind) continue;
        if (num != null) ok = p.num === num;     // '유산 46' / '흔적 XLVI' / '46'
        else if (rest) ok = hay.includes(rest);  // 지역명 등
        else ok = !!kind;                        // '유산' 만 → 유산 전부
      } else {                                   // NPC·거점
        if (kind || num != null) continue;
        ok = !!rest && hay.includes(rest);
      }
      if (!ok) continue;
      out.push({ p, id });
      if (out.length > 40) break;
    }
  }
  const head = document.createElement('div');
  head.className = 'hits-h';
  head.innerHTML = `<span>${T('results')}</span><b>${out.length}</b>` +
    `<span class="hits-x" title="${T('clearSearch')}">✕</span>`;
  head.querySelector('.hits-x').onclick = () => {
    const q = document.getElementById('q');
    q.value = ''; search(); q.focus();
  };
  hits.appendChild(head);
  if (!out.length) {
    hits.insertAdjacentHTML('beforeend', `<div class="none">${T('none')}</div>`);
    return;
  }
  for (const h of out.slice(0, 12)) {
    const d = document.createElement('div');
    d.className = isDone(h.p) ? 'it off' : 'it';
    d.innerHTML = `<span class="dot" style="background:${M.meta.layers[h.id].color}"></span>` +
      `<span>${NM(h.p)}</span><span class="a">${AR(h.p)}</span>`;
    d.onclick = () => { focusPoint(h.p, h.id); draw(); };
    hits.appendChild(d);
  }
}

// ── 진행도
// 완료 시 얻는 '아그리스의 금주화' 개수 — 유산은 전부 10개, 흔적은 번호별로 다름.
const COIN_TRACE = {1:15,2:15,3:15,4:20,5:25,6:25,7:25,8:30,9:30,10:25,16:15,17:15,18:15,19:15,20:25,21:25,22:25,23:25,24:30,25:25,31:15,32:15,33:15,34:30,35:25,36:30,37:30,38:30,39:30,40:20,46:15,47:15,48:15,49:30,50:30,51:25,52:30,53:30,54:30,55:30,61:15,62:15,63:15,64:30,65:30,66:30,67:30,68:25,69:30,70:30,76:15,77:15,78:15,79:30,80:25,81:25,82:25,83:25,84:25,85:30};
// COIN_TRACE 에 없는 번호(이번 패치 신규)는 마커에 실려온 p.coin 을 쓴다.
const traceCoin = p => (COIN_TRACE[p.num] != null) ? COIN_TRACE[p.num] : (p.coin || 0);
function coinOf(p, id) { return id === 'relic' ? 10 : id === 'trace' ? traceCoin(p) : 0; }
function coinStats() {
  let earned = 0, total = 0;
  for (const p of (M.points.relic || [])) { const v = 10;                    total += v; if (isDone(p)) earned += v; }
  for (const p of (M.points.trace || [])) { const v = traceCoin(p);           total += v; if (isDone(p)) earned += v; }
  // 금주화 퀘스트 — 하위 퀘스트별로 합산(하나만 깨도 그만큼 반영)
  for (const p of (M.points.quest || []))
    (p.quests || []).forEach((q, i) => { total += (q.c || 0); if (qDone(p, i)) earned += (q.c || 0); });
  return { earned, total, pct: total ? Math.round(earned / total * 100) : 0 };
}

function progress() {
  const tot = new Set(DONEABLE.map(keyOf));
  const el = document.getElementById('prog');
  const per = k => {
    const all = [...tot].filter(t => t.startsWith(k)).length;
    const got = [...DONE].filter(t => t.startsWith(k) && tot.has(t)).length;
    const pct = all ? Math.round(got / all * 100) : 0;
    return `<div class="prog-row"><b class="prog-k">${KND(k)}</b> : <b>${got}</b>/${all} <span class="prog-pct">(${pct}%)</span></div>`;
  };
  // 금주화 퀘스트 — 마커가 아니라 하위 퀘스트 개수로 센다
  const questRow = () => {
    const list = M.points.quest || [];
    const all = list.reduce((t, p) => t + (p.quests || []).length, 0);
    if (!all) return '';
    const got = list.reduce((t, p) => t + qCount(p), 0);
    const pct = Math.round(got / all * 100);
    return `<div class="prog-row"><b class="prog-k">${T('questShort')}</b> : <b>${got}</b>/${all} <span class="prog-pct">(${pct}%)</span></div>`;
  };
  const c = coinStats();
  const coinRow = `<div class="prog-coin"><img class="prog-coin-ic" src="${imgURL('img/00890085.webp')}" alt="아그리스의 금주화">` +
    `<b>${T('coinLabel')}</b> : <b>${c.earned}</b>/${c.total} <span class="prog-pct">(${c.pct}%)</span></div>`;
  el.innerHTML = coinRow + `<div class="prog-h">${T('progress')}</div>` +
    per('유산') + per('흔적') + questRow() + per('지식');
  _updateResetBtn();
}

    for (const p of (M.points.quest || []))
      (p.quests || []).forEach((_, i) => DONE.add(qKey(p, i)));

document.getElementById('btn-export').onclick = () => {

  const blob = new Blob([JSON.stringify(data)], { type: 'application/octet-stream' });
  const url = URL.createObjectURL(blob);
  const d = new Date();
  const stamp = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
  const a = document.createElement('a');
  a.href = url; a.download = `타키온_완료_${stamp}`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast(`완료 ${DONE.size}개를 파일로 저장했습니다`);

// 완료 데이터 파일에서 불러오기(가져오기)
document.getElementById('btn-import').onclick = () => document.getElementById('file-import').click();
document.getElementById('file-import').onchange = (e) => {
  const f = e.target.files && e.target.files[0];
  e.target.value = '';                          // 같은 파일 다시 선택 가능하게
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const parsed = JSON.parse(r.result);
      const arr = Array.isArray(parsed) ? parsed : (parsed && parsed.done);
      if (!Array.isArray(arr)) throw new Error('형식 오류');
      DONE = new Set(arr.filter(x => typeof x === 'string'));
      saveDone(); progress(); search(); draw();
      toast(`완료 ${DONE.size}개를 불러왔습니다`);
    } catch (err) {
      toast('불러오기 실패 — 올바른 파일이 아닙니다');
    }
  };
  r.readAsText(f);
};

// 맵·이미지 우클릭 저장 방지
addEventListener('contextmenu', e => e.preventDefault());
addEventListener('dragstart', e => e.preventDefault());

addEventListener('resize', resize);
// 전체화면 진입/해제 시 캔버스 백킹 스토어를 새 크기로 다시 잡아준다(안 하면 글씨/마커가 흐려짐).
document.addEventListener('fullscreenchange', () => { resize(); setTimeout(resize, 80); });
document.addEventListener('webkitfullscreenchange', () => { resize(); setTimeout(resize, 80); });
progress();
resize();
// 첫 화면은 지도 전체가 보이도록 맞춘다(버튼과 달리 여긴 시점만 맞춘다).
view.u = (BOX.u0 + BOX.u1) / 2; view.v = (BOX.v0 + BOX.v1) / 2;
view.k = kFit(); clamp(); draw();

// ── 언어 전환
function applyLang() {
  document.documentElement.lang = LANG === 'en' ? 'en' : 'ko';
  try { parent.postMessage({ type: 'tachyon-lang', lang: LANG }, '*'); } catch (e) {}  // 부모 SPA 전체화면 버튼 글씨 동기화
  document.getElementById('q').placeholder = T('search');
  document.getElementById('btn-fit').textContent = T('fit');
  document.getElementById('btn-export').textContent = T('save');
  document.getElementById('btn-import').textContent = T('load');
  document.getElementById('lang-ko').classList.toggle('on', LANG === 'ko');
  document.getElementById('lang-en').classList.toggle('on', LANG === 'en');
  const collapsed = document.getElementById('ui').classList.contains('collapsed');
  document.getElementById('ui-head').childNodes[0].nodeValue = T('title') + ' ';
  document.getElementById('ui-caret').textContent = collapsed ? T('expand') : T('collapse');
  document.getElementById('layers-h').textContent = T('layersTitle');
  setCredit(lbEl.classList.contains('video'));   // 라이트박스 출처 문구도 언어에 맞춘다
  for (const el of document.querySelectorAll('#layers .layer'))
    el.querySelector('.nm').textContent = LBL(el.dataset.layer);
  progress();
  if (sel) select(sel.p, sel.id);
  search();
  draw();
}
for (const code of ['ko', 'en']) {
  document.getElementById('lang-' + code).onclick = () => {
    if (LANG === code) return;
    LANG = code;
    try { localStorage.setItem('bdo_lang', LANG); } catch (e) {}
    applyLang();
  };
}
applyLang();
if (window.matchMedia('(max-width: 520px)').matches) {
  document.getElementById('ui').classList.add('collapsed');
  document.getElementById('ui-caret').textContent = T('expand');
}
</script>
